{% extends "base.html" %}

{% block title %}Unexpected Error{% endblock %}

{% block content %}
<section class="text-center space-y-6">
  <h1 class="text-4xl font-semibold text-gray-900">Something went wrong</h1>
  <p class="text-gray-600">
    We hit an unexpected issue while processing your request. Please try again, and contact your LabCA admin if the problem persists.
  </p>
  <div>
    <a href="/" class="inline-flex items-center rounded-md px-4 py-2 text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700">
      Return to dashboard
    </a>
  </div>
</section>
{% endblock %}
