apiVersion: apps/v1
kind: Deployment
metadata:
  name: labca
  namespace: labca-system
  labels:
    app.kubernetes.io/name: labca
  annotations:
    ignore-check.kube-linter.io/no-rolling-update-strategy: "SQLite on a ReadWriteOnce volume allows one writer, so the update must stop the old pod first (Recreate)."
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: labca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labca
    spec:
      serviceAccountName: labca
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/cameloo1/labca:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: labca-config
            - secretRef:
                name: labca-app
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: kek
              mountPath: /run/secrets/labca-kek
              readOnly: true
      containers:
        - name: labca
          image: ghcr.io/cameloo1/labca:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: labca-config
            - secretRef:
                name: labca-app
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness stays false until the issuing CA is imported
          # (workload_issuer_missing). That is intended.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: kek
              mountPath: /run/secrets/labca-kek
              readOnly: true
            - name: pki-static
              mountPath: /etc/labca/pki-static
              readOnly: true
            - name: kube-api
              mountPath: /var/run/secrets/kube-api
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: labca-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # defaultMode 0400 with fsGroup: the kubelet makes the files
        # group-readable, which UID 10001 needs to read the KEKs.
        - name: kek
          secret:
            secretName: labca-kek
            defaultMode: 0400
        # Created after the ceremony. Until then the PKI routes return 404
        # for the root files.
        - name: pki-static
          configMap:
            name: labca-pki-static
            optional: true
        # Replaces the automounted ServiceAccount token.
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
