apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: labca-data
  namespace: labca-system
  labels:
    app.kubernetes.io/name: labca
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: labca-backup
  namespace: labca-system
  labels:
    app.kubernetes.io/name: labca-backup
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
