apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labca-status
  namespace: mtls-demo
  labels:
    app.kubernetes.io/name: demo-server
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: labca.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-server
                port:
                  number: 8080
