{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="text-center space-y-6">
  <h1 class="text-4xl font-semibold text-gray-900">404</h1>
  <p class="text-gray-600">The page you’re looking for doesn’t exist or has been moved.</p>
  <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
    <a href="/" class="inline-flex items-center rounded-md px-4 py-2 text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700">
      Go to Home
    </a>
    <a href="/quick-cert" class="inline-flex items-center rounded-md px-4 py-2 text-sm font-semibold bg-gray-200 text-gray-900 hover:bg-gray-300">
      Generate a Certificate
    </a>
  </div>
</section>
{% endblock %}
