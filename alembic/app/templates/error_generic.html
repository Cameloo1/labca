{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<section class="text-center space-y-6">
  <h1 class="text-4xl font-semibold text-gray-900">Request error</h1>
  <p class="text-gray-600">
    We were unable to complete that action (status {{ status_code }}).
    {{ detail or "Please review your input and try again." }}
  </p>
  <div>
    <a href="/" class="inline-flex items-center rounded-md px-4 py-2 text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700">
      Go back home
    </a>
  </div>
</section>
{% endblock %}
