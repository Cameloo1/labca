apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: labca-system
  labels:
    app.kubernetes.io/name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: labca
  namespace: labca-system
  labels:
    app.kubernetes.io/name: labca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: labca
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mtls-demo
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [demo-server, demo-client, mtls-verifier]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API. k3s evaluates NetworkPolicy after kube-proxy DNAT, so traffic to the kubernetes Service (10.43.0.1:443) is matched as <node IP>:6443. A rule for 10.43.0.1/32:443 never matches (checked on k3s v1.35.5).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
    # Cloudflare Access JWKS, outside the pod and service CIDRs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16, 10.43.0.0/16]
      ports:
        - protocol: TCP
          port: 443
