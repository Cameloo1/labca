[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labca"
version = "0.1.0"
description = "LabCA - Certificate Authority lab environment (FastAPI skeleton)"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "sqlalchemy",
    "alembic",
    "pydantic>=1.10,<2.0",
    "pydantic-settings",
    "python-multipart",
    "httpx",
    "pytest",
    "faker",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "mypy",
]
